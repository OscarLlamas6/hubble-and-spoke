# =============================================================================
# Publica SOLO la carpeta tour/ en GitHub Pages. No es CI/CD del laboratorio.
# Activar una vez: Settings → Pages → Build and deployment → "GitHub Actions".
# =============================================================================
name: Publicar recorrido 3D

on:
  push:
    branches: [main]
    paths: ["tour/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: tour
      - id: deployment
        uses: actions/deploy-pages@v4
