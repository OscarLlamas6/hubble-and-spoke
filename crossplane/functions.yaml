# =============================================================================
# Composition Functions
# -----------------------------------------------------------------------------
# Una Function es un programa (gRPC) que Crossplane invoca en cada reconciliación:
# recibe el estado observado + el estado deseado acumulado y devuelve un estado
# deseado nuevo. En `mode: Pipeline` la Composition es una cadena de ellas.
#
# OJO: el `metadata.name` es el que usa la Composition en `functionRef.name`.
# =============================================================================

# Paso 1: genera los recursos "estáticos" a partir de plantillas + patches.
apiVersion: pkg.crossplane.io/v1
kind: Function
metadata:
  name: function-patch-and-transform
spec:
  package: xpkg.crossplane.io/crossplane-contrib/function-patch-and-transform:v0.11.2
---
# Paso 2: lógica imperativa (plantillas Go): calcula el hostname por defecto,
# genera el HTTPRoute y publica el status del XR.
apiVersion: pkg.crossplane.io/v1
kind: Function
metadata:
  name: function-go-templating
spec:
  package: xpkg.crossplane.io/crossplane-contrib/function-go-templating:v0.13.2
---
# Paso 3: marca el XR como Ready cuando todos los recursos compuestos lo están.
apiVersion: pkg.crossplane.io/v1
kind: Function
metadata:
  name: function-auto-ready
spec:
  package: xpkg.crossplane.io/crossplane-contrib/function-auto-ready:v0.7.3
