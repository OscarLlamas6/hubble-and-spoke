# =============================================================================
# GatewayClass: QUÉ IMPLEMENTACIÓN atiende los Gateways
# -----------------------------------------------------------------------------
# Rol: proveedor de infraestructura. Análogo a StorageClass o IngressClass.
# `controllerName` identifica a Envoy Gateway; sin él nadie reconciliaría.
# =============================================================================
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: envoy
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
  parametersRef:
    group: gateway.envoyproxy.io
    kind: EnvoyProxy
    name: nodeport
    namespace: envoy-gateway-system
