    blockOwnerDeletion: true
    controller: true
    kind: WebAppV2
    name: webapp
    uid: 270cb430-1903-5793-9ad4-ab2be48cb864
spec:
  hostnames:
  - webapp.v2.apps.lab.local
  parentRefs:
  - name: hub-gateway
    namespace: gateway-system
  rules:
  - backendRefs:
    - group: multicluster.x-k8s.io
      kind: ServiceImport
      name: webapp
      port: 80
    matches:
    - path:
        type: PathPrefix
        value: /
---
apiVersion: kubernetes.m.crossplane.io/v1alpha1
